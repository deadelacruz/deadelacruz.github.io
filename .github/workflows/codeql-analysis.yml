# Repository quality checks for Jekyll build and markdown lint.
# This workflow does not run CodeQL analysis.

name: "Jekyll and Markdown CI"

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [master, main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master, main]
  # Triggers the workflow on push or pull request events but only for the main branch
  schedule:
    # Runs at 6am UTC every Monday
    - cron: "0 6 * * 1"

jobs:
  # Check the Jekyll itself for errors and syntax
  build:
    name: Jekyll Build
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Check that the Jekyll can actually build
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site with Jekyll
        run: bundle exec jekyll build --future --trace --destination _site

  # Then check the markdown files are properly formatted
  analyse:
    name: Markdown Lint
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Check markdown files are markdown-lint compliant
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint markdown files with markdown-lint
        uses: articulate/actions-markdownlint@0192c450a5120d08c221e46b971885fec45e5d02 # v1.1.0
        with:
          # Includes some specific rules to ignore
          config: .github/workflows/markdownlint-config.json
          files: "_posts/**/*.md"
          # Ignore the built website, might have some funky files
          ignore: _site/
          # Try to fix basic errors
          fix: true
